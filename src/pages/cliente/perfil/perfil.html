<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mi Perfil | Beast Managers</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./perfil.css">

</head>


<body>


    <main class="perfil-page">

        <section class="perfil-card">


            <!-- VOLVER -->

            <a
                href="../dashboard/dashboard.html"
                class="volver">

                <i class="fa-solid fa-arrow-left"></i>

                Volver

            </a>


            <!-- LOGO -->

            <div class="perfil-logo">

                <img
                    src="../../../assets/img/logos/logo.jpg (2).png"
                    alt="Beast Managers">

            </div>


            <!-- TITULO -->

            <h1>
                Mi Perfil
            </h1>

            <p class="subtitulo">
                Tus datos personales
            </p>


            <!-- AVATAR -->

            <div class="perfil-avatar">

                <i class="fa-regular fa-user"></i>

            </div>


            <!-- DATOS -->

            <div class="datos-perfil">


                <div class="dato">

                    <span>
                        <i class="fa-regular fa-user"></i>
                        Nombre
                    </span>

                    <strong id="nombrePerfil">
                        Cargando...
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        <i class="fa-regular fa-user"></i>
                        Apellido
                    </span>

                    <strong id="apellidoPerfil">
                        Cargando...
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        <i class="fa-solid fa-phone"></i>
                        Teléfono
                    </span>

                    <strong id="telefonoPerfil">
                        Cargando...
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        <i class="fa-regular fa-envelope"></i>
                        Correo electrónico
                    </span>

                    <strong id="emailPerfil">
                        Cargando...
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        <i class="fa-solid fa-user-tag"></i>
                        Tipo de cuenta
                    </span>

                    <strong id="rolPerfil">
                        Cargando...
                    </strong>

                </div>


            </div>


            <!-- CERRAR SESION -->

            <button
                type="button"
                id="btnCerrarSesion"
                class="btn-cerrar">

                <i class="fa-solid fa-right-from-bracket"></i>

                Cerrar sesión

            </button>


        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="./perfil.js">
    </script>


</body>

</html>
