<meta charset="UTF-8">


<link rel="stylesheet" href="./registro.css">


<main class="registro-page">

    <section class="registro-card">

        <div class="registro-logo">

            <img
         src="/src/assets/img/logos/logo.jpg (2).png"
         alt="Beast Managers">

        </div>

        <h1>Crear Cuenta</h1>

        <p class="subtitulo">
            Bienvenido a The Beast Barbershop
        </p>

        <form id="formRegistro">

            <div class="input-group">

                <label for="nombre">Nombre</label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ingresá tu nombre"
                    required>

            </div>

            <div class="input-group">

                <label for="apellido">Apellido</label>

                <input
                    type="text"
                    id="apellido"
                    placeholder="Ingresá tu apellido"
                    required>

            </div>

            <div class="input-group">

                <label for="telefono">Celular</label>

                <input
                    type="tel"
                    id="telefono"
                    placeholder="11 6549 5730"
                    required>

            </div>

            <div class="input-group">

                <label for="email">Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required>

            </div>

            <div class="input-group">

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    placeholder="********"
                    required>

            </div>

            <div class="input-group">

                <label for="password2">Confirmar contraseña</label>

                <input
                    type="password"
                    id="password2"
                    placeholder="********"
                    required>

            </div>

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="terminos"
                    required>

                <label for="terminos">
                    Acepto los términos y condiciones
                </label>

            </div>

            <button
                type="submit"
                id="btnCrearCuenta">

                 Crear Cuenta

            </button>

        </form>

        <div class="login-link">

            <span>¿Ya tenés cuenta?</span>

            <a href="#" id="btnLogin">

                Iniciar sesión

            </a>

        </div>

    </section>
  
  <script type="module" src="./registro.js"></script>

</main>
