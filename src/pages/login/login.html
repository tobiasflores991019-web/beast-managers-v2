<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Beast Managers</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./login.css">

</head>


<body>


    <!-- ==========================
         FONDO
    =========================== -->

    <div class="background"></div>


    <!-- ==========================
         LOGIN
    =========================== -->

    <main class="login-page">


        <section class="login-card">


            <!-- LOGO -->

            <div class="login-logo">

                <img
                    src="/src/assets/img/logos/logo.jpg (2).png"
                    alt="Beast Managers">

            </div>


            <!-- TITULO -->

            <h1>
                Iniciar sesión
            </h1>


            <p class="subtitulo">
                Bienvenido nuevamente a The Beast Barbershop
            </p>


            <!-- FORMULARIO -->

            <form id="formLogin">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required>

                </div>


                <!-- CONTRASEÑA -->

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="********"
                        autocomplete="current-password"
                        required>

                </div>


                <!-- OPCIONES -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="recordarme">

                        <span>
                            Recordarme
                        </span>

                    </label>


                    <a
                        href="#"
                        id="btnRecuperar">

                        ¿Olvidaste tu contraseña?

                    </a>

                </div>


                <!-- BOTON -->

                <button
                    type="submit"
                    id="btnIniciarSesion">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Iniciar sesión

                </button>


            </form>


            <!-- REGISTRO -->

            <div class="registro-link">

                <span>
                    ¿Todavía no tenés cuenta?
                </span>

                <a
                    href="/src/pages/registro/registro.html"
                    id="btnRegistro">

                    Crear cuenta

                </a>

            </div>


            <!-- VOLVER -->

            <a
                href="/"
                class="volver">

                <i class="fa-solid fa-arrow-left"></i>

                Volver al inicio

            </a>


        </section>


    </main>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="./login.js">
    </script>


</body>

</html>
